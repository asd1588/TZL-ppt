name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Build
        run: npx vite build --base=/TZL-ppt/

      - name: Fix paths for GitHub Pages
        run: |
          sed -i "s|/img/|/TZL-ppt/img/|g" dist/assets/*.js dist/assets/*.css 2>/dev/null || true
          sed -i "s|/audio/|/TZL-ppt/audio/|g" dist/assets/*.js 2>/dev/null || true
          sed -i "s|\"/ppt/|\"/TZL-ppt/ppt/|g" dist/assets/*.js 2>/dev/null || true
          sed -i 's|"assets/|"/TZL-ppt/assets/|g' dist/assets/*.js 2>/dev/null || true

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
